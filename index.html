<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IFJ Candle Vigil</title>
  <link rel="stylesheet" href="style.css">

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBGKM6qukVRlkhDMHzBBBDYMTYaDHM8gcA",
      authDomain: "digital-vigil-1b773.firebaseapp.com",
      projectId: "digital-vigil-1b773",
      storageBucket: "digital-vigil-1b773.firebasestorage.app",
      messagingSenderId: "408186758572",
      appId: "1:408186758572:web:2b343ebb380411b4590609",
      measurementId: "G-0ZRV5R1C88"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.addDoc = addDoc;
    window.getDocs = getDocs;
    window.collection = collection;
    window.serverTimestamp = serverTimestamp;
  </script>
</head>
<body>
  <div class="container">
    <h1>Light a Candle for journalists and media workers killed in 2025</h1>
    <form id="candleForm">
      <textarea id="messageInput" maxlength="120" placeholder="Write a short message..."></textarea>
      <button type="submit">Light Candle</button>
    </form>
    <p>Total Candles: <span id="candleCount">0</span></p>
    <div id="candleWall"></div>
  </div>

  <!-- Modal for full message -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span id="modal-close">&times;</span>
      <p id="modal-text"></p>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
