<!DOCTYPE html>
<html lang="en">
<head>

   <!-- FIREBASE START -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "PASTE_YOURS",
      authDomain: "PASTE_YOURS",
      projectId: "PASTE_YOURS",
      storageBucket: "PASTE_YOURS",
      messagingSenderId: "PASTE_YOURS",
      appId: "PASTE_YOURS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.addDoc = addDoc;
    window.getDocs = getDocs;
    window.collection = collection;
    window.serverTimestamp = serverTimestamp;
  </script>
  <!-- FIREBASE END -->

  <meta charset="UTF-8">
  <title>Digital Candle Vigil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>In Memory of Journalists Killed in 2025</h1>
  <p>Total candles lit: <span id="candleCount">0</span></p>

  <form id="candleForm">
    <textarea 
      id="messageInput" 
      placeholder="Leave a message in memory…" 
      maxlength="180"
      required
    ></textarea>
    <br>
    <button type="submit">Light Candle 🕯️</button>
  </form>

  <div id="candleWall"></div>

  <!-- Modal for full message -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span id="modalClose">&times;</span>
      <p id="modalMessage"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
