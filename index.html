<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digital Candle Vigil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>In Memory of Journalists Killed in 2025</h1>
  <p>Total candles lit: <span id="candleCount">0</span></p>

  <form id="candleForm">
    <textarea 
      id="messageInput" 
      placeholder="Leave a message in memory…" 
      maxlength="180"
      required
    ></textarea>
    <br>
    <button type="submit">Light Candle 🕯️</button>
  </form>

  <div id="candleWall"></div>

  <!-- Modal for full message -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span id="modalClose">&times;</span>
      <p id="modalMessage"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
